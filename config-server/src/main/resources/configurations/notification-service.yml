server:
  port: 8040
spring:
  data:
    mongodb:
      username: ${MONGO_USER:ichaabane}
      password: ${MONGO_PASSWORD:ichaabane}
      host: ${MONGO_HOST:localhost}
      port: 27017
      database: notification
      authentication-database: admin
  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: paymentGroup,orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Only the two known event packages may be deserialized. The previous
        # wildcard ('*') allowed any class on the classpath to be instantiated
        # from broker payloads (deserialization / gadget-chain risk).
        spring.json.trusted.packages: com.ichaabane.ecommerce.kafka.order,com.ichaabane.ecommerce.kafka.payment
        spring.json.type.mapping: orderConfirmation:com.ichaabane.ecommerce.kafka.order.OrderConfirmation,paymentConfirmation:com.ichaabane.ecommerce.kafka.payment.PaymentConfirmation
  mail:
    host: ${MAIL_HOST:localhost}
    port: 1025
    username: ${MAIL_USER:ichaabane}
    password: ${MAIL_PASSWORD:ichaabane}
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

application:
  mail:
    # Sender address of the transactional emails (previously hard-coded to a
    # third-party domain inside EmailService).
    from: ${MAIL_FROM:no-reply@ecommerce.local}
