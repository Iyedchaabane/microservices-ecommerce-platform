server:
  port: 8060
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/payment
    username: ${POSTGRES_USER:ichaabane}
    password: ${POSTGRES_PASSWORD:ichaabane}
  jpa:
    hibernate:
      # "update" keeps the schema in sync without dropping existing data on every
      # restart (the previous "create" value destroyed all payments at startup).
      # The recommended target state is "validate" backed by Flyway migrations.
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: paymentConfirmation:com.ichaabane.ecommerce.notification.PaymentNotificationRequest
application:
  config:
    product-url: http://localhost:8222/api/v1/products
